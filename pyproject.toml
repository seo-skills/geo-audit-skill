[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "seomator-geo-audit"
version = "0.2.0"
description = "SEOmator GEO Audit Skill: a deterministic GEO (Generative Engine Optimization) audit CLI for Claude Code. Every number is reproducible from recorded evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["geo", "seo", "generative-engine-optimization", "ai-search", "audit", "llms-txt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "jinja2>=3.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8.0"]

[project.scripts]
geo = "geo_audit.cli:main"

[project.urls]
Homepage = "https://github.com/seo-skills/geo-audit-skill"
Source = "https://github.com/seo-skills/geo-audit-skill"
Issues = "https://github.com/seo-skills/geo-audit-skill/issues"
Changelog = "https://github.com/seo-skills/geo-audit-skill/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_audit"]
artifacts = ["src/geo_audit/assets/*"]

[tool.hatch.build.targets.sdist]
include = ["src/geo_audit", "tests", "README.md", "LICENSE", "CHANGELOG.md", "VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rs"  # -rs: skipped tests always report why
markers = [
  "browser: requires the optional Playwright extra",
]
