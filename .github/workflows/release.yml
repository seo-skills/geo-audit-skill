name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify the tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag and VERSION agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION)"
          echo "tag=$TAG file=$FILE"
          test "$TAG" = "$FILE" || { echo "::error::tag v$TAG does not match VERSION $FILE"; exit 1; }
      - name: the changelog has an entry for it
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -q "## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

  test:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python tools/lint_skills.py
      - run: python tools/gen_docs.py --check

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Trusted publishing: no long-lived token lives in this repository.
      - uses: pypa/gh-action-pypi-publish@release/v1
