name: plugin

# The plugin as a user gets it: the published marketplace, a clean Claude Code
# config, and the install command a user runs. It runs on each release tag,
# which is when the marketplace starts naming that tag, and on demand. It
# checks everything `claude plugin` can check without a login, on all three
# operating systems. A live /geo: session still needs a signed-in person.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code
      - name: the manifests pass claude code's own validator
        shell: bash
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
        run: claude plugin validate . < /dev/null
      - name: install from the published marketplace into a clean config
        shell: bash
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
        run: |
          set -euo pipefail
          claude --version
          claude plugin marketplace add seo-skills/geo-audit-skill < /dev/null
          claude plugin install geo@seomator < /dev/null
          claude plugin details geo@seomator < /dev/null | tee details.txt
          # The installed copy is this release, and every skill registered. A
          # skill whose frontmatter failed to parse is not an error here - it
          # is simply missing, so the count is the check.
          grep -q "^geo $(cat VERSION)" details.txt || { echo "::error::installed version is not $(cat VERSION)"; exit 1; }
          grep -q "Skills (9)" details.txt || { echo "::error::expected nine skills"; exit 1; }
