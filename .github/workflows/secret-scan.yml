name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scan tracked files
        run: python tools/scan_secrets.py
      - name: scan full history
        run: |
          # A secret removed in a later commit is still published.
          git log -p --all --no-color \
            | grep -nE 'AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{36,}|xox[abprs]-|pypi-AgEIcHlwaS5vcmc' \
            && { echo "::error::possible secret in git history"; exit 1; } || echo "history clean"
