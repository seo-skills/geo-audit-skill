name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Why setup-python rather than `uv pip install --system`: the Ubuntu and macOS
# runners ship an externally-managed interpreter (PEP 668), so `--system`
# refuses to install into it. It also silently ignored the matrix, because
# nothing ever installed the requested Python. setup-python provides a
# non-managed interpreter at the version the matrix asked for.

jobs:
  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: the matrix version is the one running
        shell: bash
        run: |
          python -c "import sys; print(sys.version)"
          python -c "import sys; assert sys.version.startswith('${{ matrix.python }}.'), sys.version"
      - name: install
        run: pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q

  lint:
    name: skill lint and docs freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: pip install -e ".[dev]"
      - name: skill contracts
        run: python tools/lint_skills.py
      - name: generated docs are current
        run: python tools/gen_docs.py --check

  quickstart:
    name: quickstart from a built wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: build the wheel
        run: uv build --wheel
      - name: install the wheel, not the source tree
        shell: bash
        run: pip install dist/*.whl pytest
      - name: the shipped artifact answers
        run: geo --version
      - name: README quickstart against the fixture server
        run: python -m pytest tests/test_quickstart.py -q -s

  package:
    name: package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
      - name: build
        run: uv build
      - name: check
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
